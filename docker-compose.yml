services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: uk_housing
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/uk_housing
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  postgres_data: