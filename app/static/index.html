<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UK Housing Price Search</title>
<style>
  :root {
    --bg: #f4f5f7;
    --surface: #ffffff;
    --border: #e2e4e9;
    --text: #1a1d24;
    --text-muted: #6b7280;
    --primary: #2f6fed;
    --primary-hover: #2559c7;
    --success-bg: #ecfdf3;
    --success-text: #067647;
    --error-bg: #fef3f2;
    --error-text: #b42318;
    --radius: 10px;
    --shadow: 0 1px 2px rgba(16, 24, 40, 0.04), 0 1px 3px rgba(16, 24, 40, 0.06);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101216;
      --surface: #181b21;
      --border: #2a2e37;
      --text: #e6e8eb;
      --text-muted: #9aa1ac;
      --primary: #5b8def;
      --primary-hover: #7ba1f4;
      --success-bg: #0d2318;
      --success-text: #5fd68f;
      --error-bg: #2a1414;
      --error-text: #f398a0;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
    }
  }

  * { box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    margin: 0;
    padding: 2.5rem 1.25rem 4rem;
  }

  .page {
    max-width: 880px;
    margin: 0 auto;
  }

  header {
    margin-bottom: 2rem;
  }

  h1 {
    font-size: 1.6rem;
    font-weight: 700;
    margin: 0 0 0.25rem;
    letter-spacing: -0.01em;
  }

  .subtitle {
    color: var(--text-muted);
    font-size: 0.95rem;
    margin: 0;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 1.5rem;
    margin-bottom: 1.5rem;
  }

  .card h2 {
    font-size: 1.05rem;
    margin: 0 0 1rem;
  }

  .row {
    display: flex;
    flex-wrap: wrap;
    gap: 0.75rem;
    align-items: flex-end;
  }

  .field {
    display: flex;
    flex-direction: column;
    gap: 0.35rem;
    flex: 1 1 140px;
    min-width: 0;
  }

  label {
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--text-muted);
  }

  input[type="text"],
  input[type="number"],
  input[type="date"] {
    font-size: 0.9rem;
    padding: 0.55rem 0.65rem;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--bg);
    color: var(--text);
    width: 100%;
  }

  input:focus {
    outline: 2px solid var(--primary);
    outline-offset: 1px;
  }

  input[type="file"] {
    font-size: 0.85rem;
    color: var(--text-muted);
  }

  button {
    font-size: 0.9rem;
    font-weight: 600;
    padding: 0.6rem 1.1rem;
    border: none;
    border-radius: 8px;
    background: var(--primary);
    color: #fff;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.15s ease;
  }

  button:hover { background: var(--primary-hover); }
  button:active { transform: translateY(1px); }

  .upload-row {
    display: flex;
    flex-wrap: wrap;
    gap: 0.75rem;
    align-items: center;
  }

  .status {
    margin-top: 0.9rem;
    font-size: 0.85rem;
    padding: 0.5rem 0.75rem;
    border-radius: 8px;
    display: none;
  }

  .status.visible { display: block; }
  .status.success { background: var(--success-bg); color: var(--success-text); }
  .status.error { background: var(--error-bg); color: var(--error-text); }
  .status.pending { color: var(--text-muted); background: transparent; padding-left: 0; }

  table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 1.25rem;
    font-size: 0.88rem;
  }

  th {
    text-align: left;
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--text-muted);
    padding: 0 0.6rem 0.5rem;
    border-bottom: 1px solid var(--border);
  }

  td {
    padding: 0.65rem 0.6rem;
    border-bottom: 1px solid var(--border);
  }

  tbody tr:hover { background: var(--bg); }
  tbody tr:last-child td { border-bottom: none; }

  .empty {
    color: var(--text-muted);
    font-size: 0.88rem;
    padding: 1rem 0 0;
  }
</style>
</head>
<body>
<div class="page">

  <header>
    <h1>UK Housing Price Search</h1>
    <p class="subtitle">Upload Land Registry price-paid data, then search transactions by postcode, price, and date.</p>
  </header>

  <section class="card">
    <h2>Upload CSV</h2>
    <div class="upload-row">
      <input type="file" id="csvFile" accept=".csv">
      <button id="uploadBtn">Upload</button>
    </div>
    <div id="uploadStatus" class="status"></div>
  </section>

  <section class="card">
    <h2>Search</h2>
    <div class="row">
      <div class="field">
        <label for="postcode">Postcode</label>
        <input type="text" id="postcode" placeholder="SW1">
      </div>
      <div class="field">
        <label for="minPrice">Min price</label>
        <input type="number" id="minPrice" placeholder="0">
      </div>
      <div class="field">
        <label for="maxPrice">Max price</label>
        <input type="number" id="maxPrice" placeholder="Any">
      </div>
      <div class="field">
        <label for="dateFrom">Date from</label>
        <input type="date" id="dateFrom">
      </div>
      <div class="field">
        <label for="dateTo">Date to</label>
        <input type="date" id="dateTo">
      </div>
      <div class="field" style="flex: 0 0 auto;">
        <label>&nbsp;</label>
        <button id="searchBtn">Search</button>
      </div>
    </div>
    <div id="searchStatus" class="status"></div>
    <table id="resultsTable" hidden>
      <thead>
        <tr><th>Postcode</th><th>Price</th><th>Date</th><th>Type</th></tr>
      </thead>
      <tbody id="resultsBody"></tbody>
    </table>
  </section>

</div>

<script>
function setStatus(el, message, kind) {
  el.textContent = message;
  el.className = 'status visible' + (kind ? ' ' + kind : '');
}

async function upload() {
  const fileInput = document.getElementById('csvFile');
  const status = document.getElementById('uploadStatus');
  if (!fileInput.files.length) {
    setStatus(status, 'Choose a CSV file first.', 'error');
    return;
  }
  const formData = new FormData();
  formData.append('file', fileInput.files[0]);
  setStatus(status, 'Uploading…', 'pending');
  try {
    const res = await fetch('/upload', { method: 'POST', body: formData });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || 'upload failed');
    setStatus(status, `Imported ${data.imported} row(s), rejected ${data.rejected}.`, 'success');
  } catch (err) {
    setStatus(status, err.message, 'error');
  }
}

async function search() {
  const status = document.getElementById('searchStatus');
  const table = document.getElementById('resultsTable');
  const body = document.getElementById('resultsBody');
  const params = new URLSearchParams();
  const postcode = document.getElementById('postcode').value.trim();
  const minPrice = document.getElementById('minPrice').value;
  const maxPrice = document.getElementById('maxPrice').value;
  const dateFrom = document.getElementById('dateFrom').value;
  const dateTo = document.getElementById('dateTo').value;
  if (postcode) params.set('postcode', postcode);
  if (minPrice) params.set('min_price', minPrice);
  if (maxPrice) params.set('max_price', maxPrice);
  if (dateFrom) params.set('date_from', dateFrom);
  if (dateTo) params.set('date_to', dateTo);

  setStatus(status, 'Searching…', 'pending');
  table.hidden = true;
  try {
    const res = await fetch('/search?' + params.toString());
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || 'search failed');
    setStatus(status, `${data.count} result(s).`, data.count ? 'success' : 'pending');
    body.innerHTML = data.results.map(r =>
      `<tr><td>${r.postcode}</td><td>£${r.price.toLocaleString()}</td><td>${r.date_of_transfer}</td><td>${r.property_type}</td></tr>`
    ).join('');
    table.hidden = data.results.length === 0;
  } catch (err) {
    setStatus(status, err.message, 'error');
  }
}

document.getElementById('uploadBtn').addEventListener('click', upload);
document.getElementById('searchBtn').addEventListener('click', search);
</script>

</body>
</html>
